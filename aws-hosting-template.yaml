AWSTemplateFormatVersion: '2010-09-09'
Description: Willow House Photography static website hosting scaffold

Parameters:
  DomainName:
    Type: String
    Default: willowhousephotography.com
    Description: Apex domain reserved in Route 53.
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for the domain.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 for CloudFront.
  ContactFromEmail:
    Type: String
    Default: larrycoons@larrycoons.com
    Description: Verified SES sender address used by the contact form Lambda.
  NotificationEmails:
    Type: String
    Default: larrycoons@larrycoons.com,lynseycoons@gmail.com
    Description: Comma-separated list of recipient emails for contact inquiries.
  ForwardingMailboxLocalPart:
    Type: String
    Default: lynsey
    Description: Local-part for inbound forwarding address, for example lynsey.
  ForwardingDestinationEmail:
    Type: String
    Default: lynseycoons@gmail.com
    Description: External email destination that receives forwarded inbound mail.
  ForwardingFromEmail:
    Type: String
    Default: larrycoons@larrycoons.com
    Description: Verified SES sender used when forwarding inbound emails.

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DomainName
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'

  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${DomainName}-images'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - GET
            AllowedOrigins:
              - '*'
            AllowedHeaders:
              - '*'
            MaxAge: 3000

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadForImages
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ImagesBucket.Arn}/*'

            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'

  ContactFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AllowSesEmailDelivery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'

  ContactFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ContactFunctionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          FROM_EMAIL: !Ref ContactFromEmail
          TO_EMAILS: !Ref NotificationEmails
          SITE_DOMAIN: !Ref DomainName
      Code:
        ZipFile: |
          import base64
          import json
          import os
          import boto3
          from botocore.exceptions import BotoCoreError, ClientError

          ses = boto3.client('sesv2')

          def _json(status, payload):
              return {
                  'statusCode': status,
                  'headers': {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'content-type',
                      'Access-Control-Allow-Methods': 'OPTIONS,POST'
                  },
                  'body': json.dumps(payload)
              }

          def _parse(event):
              body = event.get('body') or '{}'
              if event.get('isBase64Encoded'):
                  body = base64.b64decode(body).decode('utf-8')
              return json.loads(body)

          def handler(event, context):
              method = event.get('requestContext', {}).get('http', {}).get('method', '')
              if method == 'OPTIONS':
                  return _json(200, {'ok': True})

              if method != 'POST':
                  return _json(405, {'message': 'Method not allowed.'})

              data = _parse(event)
              name = (data.get('name') or '').strip()
              email = (data.get('email') or '').strip()
              phone = (data.get('phone') or '').strip()
              session_type = (data.get('sessionType') or '').strip()
              message = (data.get('message') or '').strip()

              if not name or not email or not message:
                  return _json(400, {'message': 'Name, email, and message are required.'})

              recipients = [item.strip() for item in os.environ.get('TO_EMAILS', '').split(',') if item.strip()]
              if not recipients:
                  return _json(500, {'message': 'No recipient emails configured.'})

              print(json.dumps({
                  'level': 'info',
                  'message': 'Preparing SES send_email call',
                  'awsRequestId': context.aws_request_id,
                  'fromEmail': os.environ.get('FROM_EMAIL', ''),
                  'recipientCount': len(recipients),
                  'recipients': recipients,
                  'senderEmail': email,
              }))

              subject = f"Willow House Photography inquiry from {name}"
              plain = [
                  'New inquiry received from willowhousephotography.com',
                  '',
                  f'Name: {name}',
                  f'Email: {email}',
                  f'Phone: {phone or "-"}',
                  f'Session Type: {session_type or "-"}',
                  '',
                  'Message:',
                  message,
              ]

              try:
                  response = ses.send_email(
                      FromEmailAddress=os.environ['FROM_EMAIL'],
                      Destination={'ToAddresses': recipients},
                      ReplyToAddresses=[email],
                      Content={
                          'Simple': {
                              'Subject': {'Data': subject, 'Charset': 'UTF-8'},
                              'Body': {
                                  'Text': {'Data': '\n'.join(plain), 'Charset': 'UTF-8'},
                              },
                          },
                        },
                  )
              except (ClientError, BotoCoreError) as exc:
                  print(json.dumps({
                      'level': 'error',
                      'message': 'SES send_email failed',
                      'awsRequestId': context.aws_request_id,
                      'error': str(exc),
                  }))
                  return _json(502, {'message': 'Unable to send inquiry email right now.'})

              print(json.dumps({
                  'level': 'info',
                  'message': 'SES send_email accepted',
                  'awsRequestId': context.aws_request_id,
                  'messageId': response.get('MessageId', ''),
                  'recipients': recipients,
              }))

              return _json(200, {'ok': True, 'message': 'Inquiry sent.'})

  ContactApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${DomainName}-contact-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowCredentials: false
        AllowHeaders:
          - content-type
        AllowMethods:
          - OPTIONS
          - POST
        AllowOrigins:
          - !Sub 'https://${DomainName}'
          - !Sub 'https://www.${DomainName}'

  ContactApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ContactApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
        - FunctionArn: !GetAtt ContactFunction.Arn
      PayloadFormatVersion: '2.0'

  ContactApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ContactApi
      RouteKey: POST /api/contact
      Target: !Sub 'integrations/${ContactApiIntegration}'

  ContactApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ContactApi
      StageName: '$default'
      AutoDeploy: true

  ContactApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ContactFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ContactApi}/*/*/api/contact'

  InboundMailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${DomainName}-inbound-mail'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireInboundMail
            Status: Enabled
            ExpirationInDays: 30
            Prefix: inbound/

  InboundMailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref InboundMailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSesPutInboundMessages
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${InboundMailBucket.Arn}/inbound/*'
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
              StringLike:
                AWS:SourceArn: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${InboundReceiptRuleSet}:receipt-rule/*'

  InboundForwardRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InboundForwardPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${InboundMailBucket.Arn}/inbound/*'
              - Effect: Allow
                Action:
                  - ses:SendRawEmail
                Resource: '*'

  InboundForwardFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt InboundForwardRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          INBOUND_BUCKET: !Ref InboundMailBucket
          INBOUND_PREFIX: inbound/
          FORWARD_TO_EMAIL: !Ref ForwardingDestinationEmail
          FORWARD_FROM_EMAIL: !Ref ForwardingFromEmail
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          from email import policy
          from email.parser import BytesParser
          from email.message import EmailMessage

          s3 = boto3.client('s3')
          ses = boto3.client('ses')

          def _find_text_part(message, subtype):
              content_type = f'text/{subtype}'
              if message.get_content_type() == content_type:
                  try:
                      return message.get_content()
                  except Exception:
                      return None

              for part in message.walk():
                  if part.get_content_type() != content_type:
                      continue
                  if part.get_content_disposition() not in (None, 'inline'):
                      continue
                  try:
                      return part.get_content()
                  except Exception:
                      continue
              return None

          def handler(event, context):
              record = event.get('Records', [{}])[0].get('ses', {})
              mail = record.get('mail', {})
              receipt = record.get('receipt', {})

              message_id = mail.get('messageId')
              if not message_id:
                  raise ValueError('SES event missing mail.messageId')

              bucket = os.environ['INBOUND_BUCKET']
              prefix = os.environ.get('INBOUND_PREFIX', 'inbound/')
              key = f"{prefix}{message_id}"

              obj = s3.get_object(Bucket=bucket, Key=key)
              raw_bytes = obj['Body'].read()
              parsed = BytesParser(policy=policy.default).parsebytes(raw_bytes)

              original_subject = parsed.get('subject', '(no subject)')
              original_from = mail.get('source', '(unknown sender)')
              original_to = ', '.join(receipt.get('recipients', [])) or '(unknown recipient)'
              original_text = _find_text_part(parsed, 'plain')

              forwarded = EmailMessage()
              forwarded['Subject'] = f"Fwd: {original_subject}"
              forwarded['From'] = os.environ['FORWARD_FROM_EMAIL']
              forwarded['To'] = os.environ['FORWARD_TO_EMAIL']
              forwarded['Reply-To'] = original_from

              body_lines = [
                  'Forwarded inbound email from willowhousephotography.com',
                  '',
                  f'Original From: {original_from}',
                  f'Original To: {original_to}',
                  f'SES Message ID: {message_id}',
                  '',
                  'Original Message:',
                  original_text or '(No plain text content available.)',
              ]
              forwarded.set_content('\n'.join(body_lines))

              response = ses.send_raw_email(
                  Source=os.environ['FORWARD_FROM_EMAIL'],
                  Destinations=[os.environ['FORWARD_TO_EMAIL']],
                  RawMessage={'Data': forwarded.as_bytes()},
              )

              print(json.dumps({
                  'message': 'Inbound email forwarded',
                  'awsRequestId': context.aws_request_id,
                  'sesInboundMessageId': message_id,
                  'sesOutboundMessageId': response.get('MessageId', ''),
                  'destination': os.environ['FORWARD_TO_EMAIL'],
              }))

              return {'ok': True}

  InboundForwardPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref InboundForwardFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${InboundReceiptRuleSet}:receipt-rule/*'

  InboundReceiptRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: !Sub '${DomainName}-inbound-rules'

  InboundForwardReceiptRule:
    Type: AWS::SES::ReceiptRule
    Properties:
      RuleSetName: !Ref InboundReceiptRuleSet
      Rule:
        Name: !Sub '${DomainName}-forward-${ForwardingMailboxLocalPart}'
        Enabled: true
        ScanEnabled: true
        TlsPolicy: Optional
        Recipients:
          - !Sub '${ForwardingMailboxLocalPart}@${DomainName}'
        Actions:
          - S3Action:
              BucketName: !Ref InboundMailBucket
              ObjectKeyPrefix: inbound/
          - LambdaAction:
              FunctionArn: !GetAtt InboundForwardFunction.Arn
              InvocationType: Event

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${DomainName}-oac'
        Description: Access control for Willow House Photography website bucket
        SigningBehavior: always
        SigningProtocol: sigv4
        OriginAccessControlOriginType: s3

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: website-origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref OriginAccessControl
          - Id: images-origin
            DomainName: !GetAtt ImagesBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref OriginAccessControl
          - Id: api-origin
            DomainName: !Sub '${ContactApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: website-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: /images/*
            TargetOriginId: images-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
          - PathPattern: /api/*
            TargetOriginId: api-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            ForwardedValues:
              QueryString: true
              Headers:
                - Content-Type
                - Origin
                - Access-Control-Request-Method
                - Access-Control-Request-Headers
              Cookies:
                Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  WebsiteRecordApex:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebsiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WebsiteRecordWww:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebsiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  InboundMailMxRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: MX
      TTL: 300
      ResourceRecords:
        - !Sub '10 inbound-smtp.${AWS::Region}.amazonaws.com'

Outputs:
  WebsiteBucketName:
    Value: !Ref WebsiteBucket
  ImagesBucketName:
    Value: !Ref ImagesBucket
  CloudFrontDistributionId:
    Value: !Ref WebsiteDistribution
  WebsiteUrl:
    Value: !Sub 'https://${DomainName}'
  ContactApiRoute:
    Value: !Sub 'https://${DomainName}/api/contact'
  ForwardingInboxAddress:
    Value: !Sub '${ForwardingMailboxLocalPart}@${DomainName}'
  ForwardingDestinationAddress:
    Value: !Ref ForwardingDestinationEmail
  InboundReceiptRuleSetName:
    Value: !Ref InboundReceiptRuleSet

